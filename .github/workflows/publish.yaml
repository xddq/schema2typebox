# src: https://github.com/JS-DevTools/npm-publish
on:
  push:
    branches: main

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version-file: ".nvmrc"
      - name: Install Dependencies
        run: yarn --immutable
      - name: Compile
        run: yarn read
      - name: publish
        run: npm publish
